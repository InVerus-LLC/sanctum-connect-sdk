# Read-only verification: npm rejected removing latest from the initial alpha.
name: Verify alpha distribution tags
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full reviewed commit SHA (must match dev)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  alpha-tags:
    if: github.repository == 'InVerus-LLC/sanctum-connect-sdk' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify reviewed revision
        env:
          REVIEWED_REVISION: ${{ inputs.revision }}
        run: |
          test "$REVIEWED_REVISION" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Verify published alpha tags without registry mutations
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const packages = ['@sanctum.ai/connect', '@sanctum.ai/connect-react'];
          const version = '0.1.0-alpha.0';
          for (const name of packages) {
            const tags = JSON.parse(execFileSync('npm', ['view', name, 'dist-tags', '--json', '--prefer-online'], { encoding: 'utf8' }));
            if (tags.next !== version) throw new Error(`${name}: next is not the approved alpha`);
            if (tags.latest !== undefined && tags.latest !== version) {
              throw new Error(`${name}: latest identifies another release; review the expected tags`);
            }
            console.log(`${name}: next=${tags.next}, latest=${tags.latest ?? '(absent)'}; alpha, not a stable release`);
          }
          JS
