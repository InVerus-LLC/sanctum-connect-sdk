# Manual repair for npm assigning latest during first-package processing.
name: Manual alpha distribution tags
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full reviewed commit SHA (must match dev)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  alpha-tags:
    if: github.repository == 'InVerus-LLC/sanctum-connect-sdk' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify reviewed revision
        env:
          REVIEWED_REVISION: ${{ inputs.revision }}
        run: |
          test "$REVIEWED_REVISION" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Remove only the unintended first-alpha latest tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const packages = ['@inverus/connect', '@inverus/connect-react'];
          const version = '0.1.0-alpha.0';
          const read = (name) => JSON.parse(execFileSync('npm', ['view', name, 'dist-tags', '--json', '--prefer-online'], { encoding: 'utf8' }));
          const plans = packages.map((name) => ({ name, tags: read(name) }));
          for (const { name, tags } of plans) {
            if (tags.next !== version) throw new Error(`${name}: next is not the approved alpha`);
            if (tags.latest !== undefined && tags.latest !== version) {
              throw new Error(`${name}: latest changed; refusing to remove another release`);
            }
          }
          for (const { name, tags } of plans) {
            if (tags.latest === undefined) continue;
            const current = read(name);
            if (current.next !== version || current.latest !== version) {
              throw new Error(`${name}: distribution tags changed after preflight`);
            }
            execFileSync('npm', ['dist-tag', 'rm', name, 'latest'], { stdio: 'inherit' });
          }
          for (const name of packages) {
            const tags = read(name);
            if (tags.next !== version || tags.latest !== undefined) {
              throw new Error(`${name}: postflight tag verification failed`);
            }
          }
          JS
